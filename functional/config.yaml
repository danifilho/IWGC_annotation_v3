############################################################################
# IWGC functional annotation — configuration
# Paths are RELATIVE to volume_name (the working directory), which is
# bind-mounted into the containers. Inputs/databases must live inside it
# (real files or hard links, not symlinks pointing outside it).
############################################################################

# Absolute path of the functional working directory
volume_name: /mnt/gs21/scratch/USER/IWGC_annotation_v3/functional

# Genome FASTA in inputs/ (used by gffread to extract proteins from the GFF)
fasta_file: genome.fasta

# Structural annotation GFF3 in inputs/ (e.g. PhaMi.v3.gff3 from the structural pipeline)
final_filtering_gff: PhaMi.v3.gff3

# Species code -> output names
species_name: PhaMi

# MMseqs2 databases. The entry named 'ncbi' is REQUIRED: it provides the
# "NCBI DESCRIPTION" column and the product names of the functional GFF.
#   path:     FASTA or MMseqs DB searched with easy-search
#   ncbidata: protein FASTA with full headers (descriptions)
mmseqs_databases:
  - name: 'ncbi'
    # Use the REPAIRED FASTA (scripts/fix_fasta_headers.py): the original
    # GenomesDatabase.v1.prot has glued headers that merge 49,542 proteins into
    # one 18.9 M aa record (AA049522-RA). See docs/TROUBLESHOOTING.md #28.
    path: 'databases/current/GenomesDatabase.v1.fixed.prot'
    ncbidata: 'databases/current/GenomesDatabase.v1.fixed.prot'
  - name: 'herbres'
    path: 'databases/herb_res_prots/total_KO_labeled.fasta'
  - name: 'uniref'
    path: 'databases/mmseqs_db/uniref50'

# NCBI best hit: report the best hit that HAS a description in the FASTA
# header; fall back to the overall best hit only when no named hit exists.
# GenomesDatabase.v1 contains 49,542 unnamed "AA...-RA" proteins (oat, added
# from CoGe) that would otherwise be the best hit of ~60 % of grass genes.
ncbi_prefer_named_hits: true

# MultiLoc2 wrapper script in scripts/ (do not change)
multiloc_script: ml2_one_by_one.sh

# ---------------------------------------------------------- functional GFF3
# Release tag and column-2 source of the IWGC functional GFF3
annotation_version: v3
gff_source: IWGC_v3
# Written to the "##Tool" header line
functional_tools: "InterProScan 5.77-108.0, MultiLoc2, MMseqs2"
# Optional 2-column table (NCBI protein accession <TAB> GeneID) for the GeneID
# field of Dbxref; build it with scripts/make_geneid_map.sh (NCBI gene2refseq). Without it, the LOC
# number in the NCBI description is used when present, otherwise "NA".
ncbi_geneid_map: ""
